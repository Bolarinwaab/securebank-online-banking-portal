name: SecureBank Security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install application dependencies
        run: npm install --prefix app

      - name: Dependency audit
        run: npm audit --prefix app --audit-level=high

      - name: Secret-pattern check
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password\s*[:=]\s*["'"']|api[_-]?key\s*[:=])' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude='*.md' \
            --exclude='*.sql' \
            --exclude='docker-compose.yml' \
            --exclude='package-lock.json' \
            .; then
            echo 'Potential secret pattern found'; exit 1
          fi
