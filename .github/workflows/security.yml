name: SecureBank Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install application dependencies
        run: npm install --prefix app --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --prefix app --audit-level=high

      - name: Secret-pattern check
        shell: bash
        run: |
          set -euo pipefail
          # Synthetic authentication values in tests are deliberately non-secret fixtures.
          # Keep production/configuration files covered while excluding only tests/ from this
          # lightweight heuristic to avoid false positives on test payload field names.
          if git grep -nE "BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password[[:space:]]*[:=][[:space:]]*[^[:space:]]+|api[_-]?key[[:space:]]*[:=]" -- \
            '*.js' '*.json' '*.yml' '*.yaml' '*.tf' ':(exclude)tests/**'; then
            echo 'Potential secret pattern found'; exit 1
          fi
