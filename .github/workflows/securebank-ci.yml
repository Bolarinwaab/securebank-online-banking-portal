name: SecureBank CI
on:
  push:
    branches: [main, 'feature/**', 'implementation/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install application
        run: npm ci --prefix app
      - name: Run tests
        run: npm test --prefix app
      - name: Syntax and repository checks
        run: |
          npm run check --prefix app
          test -f README.md
          test -f app/server.js
          test -f app/src/banking.js
          test -f app/public/index.html
          test -f infrastructure/terraform/main.tf
      - name: Dependency audit
        run: npm audit --prefix app --audit-level=high
