name: SecureBank CI
on:
  push:
    branches: [main, 'feature/**', 'implementation/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run application tests
        run: npm test --prefix app
      - name: Dependency audit
        run: npm audit --prefix app --audit-level=high
      - name: Repository checks
        run: |
          test -f README.md
          test -f app/server.js
          test -f app/public/index.html
          test -f infrastructure/terraform/main.tf || true
