name: SecureBank CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: |
          test -f README.md
          test -f api/openapi.yaml
          test -f frontend/index.html
          test -f backend/server.js
          echo "Repository structure validated."
