services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securebank
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_banking_schema.sql:/docker-entrypoint-initdb.d/001_initial_banking_schema.sql:ro
      - ./database/migrations/002_reconciliation_controls.sql:/docker-entrypoint-initdb.d/002_reconciliation_controls.sql:ro
      - ./database/migrations/003_runtime_compatibility.sql:/docker-entrypoint-initdb.d/003_runtime_compatibility.sql:ro
      - ./database/seed/001_demo_data.sql:/docker-entrypoint-initdb.d/004_demo_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebank -d securebank"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./app
    environment:
      NODE_ENV: production
      PERSISTENCE: postgres
      PORT: 8080
      DATABASE_URL: postgresql://securebank:securebank_local_only@postgres:5432/securebank
      DATABASE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
